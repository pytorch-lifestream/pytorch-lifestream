[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-lifestream"
version = "0.7.0"
description = "Lifestream data analysis with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb",
    "hydra-core>=1.1.2",
    "numpy>=1.21.5",
    "omegaconf",
    "pandas>=1.3.5",
    "pyarrow>=6.0.1",
    "pytorch-lightning>=1.6.0",
    "scikit-learn>=1.0.2",
    "torch>=1.12.0",
    "torchmetrics>=0.9.0",
    "transformers",
    "dask",
    "pymonad",
    "spacy==3.7.4",
]

[dependency-groups]
dev = [
    # Keep the validated ONNX Runtime version.
    "onnxruntime==1.16.3",
    "onnx",
    "pytest",
    "pylint",
    "jupyter",
    "pytest-cov",
    "twine",
    "setuptools>=59.5.0,<81",
    "catboost",
    "mkdocs",
    "matplotlib>=3.1.1",
    "pandas",
    "scikit-learn>=0.21.2",
    "pyspark==3.4.0",
    "tqdm>=4.32.2",
    "tensorboard>=2.1.0",
    "pyhocon",
    "hydra-optuna-sweeper>=1.2.0",
    # Preserve the validated DuckDB version from the previous requirements.txt.
    "duckdb==0.8.0",
    "pyarrow>=7.0",
    # Retain the version validated with torch 1.12.
    "transformers==4.46.3",
    "hydra-core>=1.1.2",
    "torch==1.12.1",
    "joblib~=1.4.2",
    "numpy~=1.24.4",
    "omegaconf~=2.3.0",
    "scipy~=1.10.1",
    "pymonad==2.4.0",
    "distributed==2023.5.0",
    "dask==2023.5.0",
    "spacy==3.7.4",
]

[tool.uv.dependency-groups]
# The existing development stack uses torch 1.12 and NumPy 1.24.
dev = {requires-python = ">=3.10,<3.11"}

[tool.pytest.ini_options]
testpaths = ["ptls_tests"]

[tool.setuptools.packages.find]
include = ["ptls", "ptls.*"]
namespaces = false
